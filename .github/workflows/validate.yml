name: Validate visual
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm exec playwright install chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atlyn-pareto-package
          path: |
            dist/*.pbiviz
            artifacts/package-report.json
            artifacts/SHA256SUMS.txt
            artifacts/dependency-licenses.json
